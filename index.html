<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Glasses - Base Modular</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, sans-serif;
    }

    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      font-size: 14px;
      text-align: center;
      z-index: 10;
    }

    #start-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 32px;
      font-size: 18px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      z-index: 20;
    }

    #settings-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      font-size: 24px;
      z-index: 15;
    }

    #settings-panel {
      position: fixed;
      bottom: 84px;
      right: 20px;
      width: min(280px, 80vw);
      background: rgba(20, 20, 20, 0.92);
      border-radius: 12px;
      padding: 16px;
      color: #fff;
      z-index: 15;
    }

    #settings-panel h3 {
      font-size: 15px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .settings-row:last-child {
      border-bottom: none;
    }

    .settings-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <video id="camera-feed" autoplay playsinline muted></video>
  <canvas id="overlay-canvas"></canvas>

  <div id="status" class="hidden"></div>

  <button id="start-btn">Ativar câmera</button>

  <button id="settings-btn">⚙</button>
  <div id="settings-panel" class="hidden">
    <h3>Módulos</h3>
    <div id="settings-list"></div>
  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
